name: Build kta Markdown proof

on:
  pull_request:
    paths:
      - 'scripts/generate_markdown_proof.py'
      - 'scripts/normalize_markdown_proof.py'
      - 'data/rules.json'
      - 'data/examples.json'
      - 'data/categories.json'
      - '.github/workflows/build-kta-markdown-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-markdown:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install transliteration tooling
        run: python -m pip install --disable-pip-version-check indic-transliteration
      - name: Generate complete linked Markdown
        run: |
          python scripts/generate_markdown_proof.py
          python scripts/normalize_markdown_proof.py
      - name: Validate publication endpoint
        shell: bash
        run: |
          set -euo pipefail
          proof=vyakaranamlikhitam/kta/kta-process-map.md
          test -s "$proof"
          grep -q '<a id="preamble-1"></a>' "$proof"
          grep -q '<a id="preamble-2"></a>' "$proof"
          test "$(grep -c '<a id="chapter-[0-9][0-9]"></a>' "$proof")" = 11
          test "$(grep -c '<a id="gana-[0-9][0-9]"></a>' "$proof")" = 11
          test "$(grep -c '<a id="dhatu-' "$proof")" -gt 1500
          grep -q '<a id="dhatu-11-s001"></a>' "$proof"
          ! grep -q '√-</i>' "$proof"
          find vyakaranamlikhitam/kta -maxdepth 1 -type f ! -name 'kta-process-map.md' -delete
          test "$(find vyakaranamlikhitam/kta -maxdepth 1 -type f | wc -l)" = 1
      - name: Commit generated proof to PR branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'Generated Markdown is already current.'
          else
            git commit -m 'Publish complete linked kta Markdown proof'
            git push origin HEAD:${{ github.head_ref }}
          fi
