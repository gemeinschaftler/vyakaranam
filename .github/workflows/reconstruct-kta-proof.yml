name: Reconstruct kta proof PDF

on:
  pull_request:
    paths:
      - '.github/pdf-staging/kta/**'
      - '.github/workflows/reconstruct-kta-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Install PDF validator
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Reconstruct exact binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vyakaranamlikhitam/kta
          cat .github/pdf-staging/kta/part*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/kta-process-map-proof.pdf
          test "$(stat -c%s /tmp/kta-process-map-proof.pdf)" = "46002"
          echo "b69dc572c3547ced59c57806e453100388209787eb42a839a201cedf133c6818  /tmp/kta-process-map-proof.pdf" | sha256sum --check
          pdfinfo /tmp/kta-process-map-proof.pdf | grep -q '^Pages:[[:space:]]*3$'
          pdftoppm -f 1 -singlefile -png /tmp/kta-process-map-proof.pdf /tmp/kta-proof-page >/dev/null 2>&1
          test -s /tmp/kta-proof-page.png
          mv /tmp/kta-process-map-proof.pdf vyakaranamlikhitam/kta/kta-process-map-proof.pdf
      - name: Leave only final PDFs in the proof folder
        run: |
          rm -rf .github/pdf-staging
          rm -f .github/workflows/reconstruct-kta-proof.yml
          rm -f tmp-binary-check.txt
          rm -f vyakaranamlikhitam/kta/README.md
          rm -f vyakaranamlikhitam/kta/.binary-upload-note
      - name: Commit verified binary to PR branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Replace kta proof PDF with verified IAST binary"
          git push origin HEAD:${{ github.head_ref }}
